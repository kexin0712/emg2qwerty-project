# @package _global_
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

band_rotation:
  _target_: emg2qwerty.transforms.ForEach  # i.i.d rotation offset for each band
  transform:
    _target_: emg2qwerty.transforms.RandomBandRotation
    offsets: [-1, 0, 1]

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120  # Max 60ms jitter for 2kHz EMG

select_channels:
  _target_: emg2qwerty.transforms.SelectEMGChannels
  channels: 16

downsample:
  _target_: emg2qwerty.transforms.TemporalDownsample
  factor: 1

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16  # Downsamples from 2kHz to 125Hz

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 3
  time_mask_param: 25  # Max 200ms per time mask for 125Hz spectrogram
  n_freq_masks: 2
  freq_mask_param: 4

magnitude_warp:
  _target_: emg2qwerty.transforms.MagnitudeWarping
  sigma: 0.15
  knot: 4
  independent_channels: true

gaussian_noise:
  _target_: emg2qwerty.transforms.AddGaussianNoise
  std: 0.01

temporal_attenuation:
  _target_: emg2qwerty.transforms.RandomTemporalAttenuation
  apply_prob: 0.5
  min_scale: 0.3
  max_scale: 0.7
  min_width: 100
  max_width: 400

transforms:
  train:
    - ${to_tensor}
    - ${select_channels}
    - ${band_rotation}
    - ${temporal_jitter}
    - ${downsample}
    - ${logspec}
    - ${specaug}

  val:
    - ${to_tensor}
    - ${select_channels}
    - ${downsample}
    - ${logspec}

  test: ${transforms.val}
