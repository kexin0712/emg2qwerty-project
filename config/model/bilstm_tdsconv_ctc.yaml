# @package _global_

module:
  _target_: emg2qwerty.models.bilstm_tdsconv_ctc.BiLSTMTDSConvCTCModule

  # freq * channels = (n_fft // 2 + 1) * 16
  in_features: 528
  mlp_features: [384]

  # --- LSTM encoder params (your new model) ---
  lstm_hidden: 512
  lstm_layers: 2
  lstm_dropout: 0.1

  # --- Keep these for init compatibility (even if not used) ---
  block_channels: [24, 24, 24, 24]
  kernel_width: 32

  # --- Training components wired from global configs ---
  optimizer: ${optimizer}
  lr_scheduler: ${lr_scheduler}
  decoder: ${decoder}

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000   # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context

